name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       kitchen_quest_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Verificar imports y tablas
        working-directory: backend
        run: python -c "from main import app; print('✅ Backend importa correctamente')"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kitchen_quest_test
          SECRET_KEY:   test_secret_key_for_ci_only
          ALGORITHM:    HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 10080